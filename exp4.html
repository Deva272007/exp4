<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Harmony Beats - Sign In & Sign Up</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: white;
            min-height: 100vh;
        }

        /* Header */
        header {
            background-color: #111827;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            font-size: 32px;
        }

        header p {
            color: #ccc;
            margin-top: 5px;
        }

        /* Navigation Bar */
        nav {
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 15px 20px;
            display: block;
        }

        nav a:hover {
            background-color: #444;
        }

        /* Dropdown */
        .dropdown {
            position: relative;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #222;
            min-width: 150px;
            z-index: 1;
        }

        .dropdown-content a {
            padding: 12px;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        /* Main Section */
        .container {
            width: 90%;
            max-width: 1000px;
            margin: 40px auto;
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
        }

        .title h2 {
            font-size: 28px;
        }

        /* Forms */
        .forms {
            display: flex;
            gap: 30px;
            justify-content: center;
        }

        .form-box {
            background-color: white;
            color: #333;
            width: 50%;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
        }

        .form-box h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        input:focus {
            outline: none;
            border-color: #0f3460;
        }

        /* Validation */
        input:invalid:not(:placeholder-shown) {
            border-color: red;
        }

        input:valid:not(:placeholder-shown) {
            border-color: green;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 6px;
            background-color: #0f3460;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #16213e;
        }

        /* Footer */
        footer {
            background-color: #111827;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }

        /* Tablet */
        @media screen and (max-width: 768px) {

            nav {
                flex-direction: column;
            }

            nav a {
                width: 100%;
                text-align: center;
            }

            .dropdown {
                width: 100%;
                text-align: center;
            }

            .dropdown-content {
                position: static;
                width: 100%;
            }

            .forms {
                flex-direction: column;
            }

            .form-box {
                width: 100%;
            }
        }

        /* Mobile */
        @media screen and (max-width: 480px) {

            header h1 {
                font-size: 25px;
            }

            .container {
                width: 95%;
                margin: 25px auto;
            }

            .form-box {
                padding: 20px;
            }

            .title h2 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>🎵 Harmony Beats</h1>
        <p>Feel the Rhythm • Live the Music</p>
    </header>

    <!-- Navigation Bar -->
    <nav>

        <div class="dropdown">
            <a href="#">Home ▼</a>

            <div class="dropdown-content">
                <a href="#">Music</a>
                <a href="#">Albums</a>
                <a href="#">Videos</a>
            </div>
        </div>

        <a href="#">About</a>
        <a href="#">Events</a>
        <a href="#">Band</a>
        <a href="#">Contact</a>

    </nav>

    <!-- Main Content -->
    <main class="container">

        <div class="title">
            <h2>Welcome to Harmony Beats</h2>
            <p>Join our musical community</p>
        </div>

        <div class="forms">

            <!-- SIGN IN FORM -->
            <div class="form-box">

                <h2>Sign In</h2>

                <form>

                    <label for="loginEmail">Email</label>

                    <input type="email"
                           id="loginEmail"
                           placeholder="Enter your email"
                           required>

                    <label for="loginPassword">Password</label>

                    <input type="password"
                           id="loginPassword"
                           placeholder="Enter your password"
                           minlength="8"
                           maxlength="20"
                           title="Password must contain 8 to 20 characters"
                           required>

                    <button type="submit">Sign In</button>

                </form>

            </div>


            <!-- SIGN UP FORM -->
            <div class="form-box">

                <h2>Sign Up</h2>

                <form>

                    <!-- Name Constraint -->
                    <label for="name">Full Name</label>

                    <input type="text"
                           id="name"
                           placeholder="Enter your name"
                           minlength="3"
                           maxlength="30"
                           pattern="[A-Za-z ]+"
                           title="Name should contain only letters and spaces"
                           required>


                    <!-- Email Constraint -->
                    <label for="email">Email</label>

                    <input type="email"
                           id="email"
                           placeholder="Enter your email"
                           required>


                    <!-- Mobile Constraint -->
                    <label for="phone">Mobile Number</label>

                    <input type="text"
                           id="phone"
                           placeholder="Enter 10 digit mobile number"
                           minlength="10"
                           maxlength="10"
                           pattern="[0-9]{10}"
                           title="Enter exactly 10 digits"
                           required>


                    <!-- Password Constraint -->
                    <label for="password">Password</label>

                    <input type="password"
                           id="password"
                           placeholder="Create a password"
                           minlength="8"
                           maxlength="20"
                           title="Password must contain 8 to 20 characters"
                           required>


                    <button type="submit">Sign Up</button>

                </form>

            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Harmony Beats. All Rights Reserved.</p>
        <p>Music Street, Chennai, Tamil Nadu</p>
    </footer>

</body>
</html>
